<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0f19"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Ambient glow -->
  <circle cx="600" cy="200" r="400" fill="#3b82f6" opacity="0.06"/>
  <circle cx="900" cy="500" r="300" fill="#6366f1" opacity="0.04"/>
  <!-- Logo mark -->
  <rect x="80" y="80" width="48" height="48" rx="12" fill="url(#accent)"/>
  <text x="104" y="112" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="white" text-anchor="middle">PL</text>
  <!-- Brand name -->
  <text x="144" y="112" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#f8fafc">PollLabs</text>
  <!-- Title -->
  <text x="80" y="260" font-family="system-ui,sans-serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">Polls that live</text>
  <text x="80" y="330" font-family="system-ui,sans-serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">where developers read</text>
  <!-- Subtitle -->
  <text x="80" y="400" font-family="system-ui,sans-serif" font-size="22" fill="#94a3b8">Embeddable polls, SVG badges, and public leaderboards.</text>
  <text x="80" y="435" font-family="system-ui,sans-serif" font-size="22" fill="#94a3b8">Sub-5KB embed. Zero tracking. Open source.</text>
  <!-- Stats bar -->
  <rect x="80" y="500" width="200" height="60" rx="12" fill="white" opacity="0.04"/>
  <rect x="300" y="500" width="200" height="60" rx="12" fill="white" opacity="0.04"/>
  <rect x="520" y="500" width="200" height="60" rx="12" fill="white" opacity="0.04"/>
  <text x="180" y="536" font-family="monospace" font-size="28" font-weight="700" fill="#3b82f6" text-anchor="middle">4.9KB</text>
  <text x="180" y="555" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">GZIPPED</text>
  <text x="400" y="536" font-family="monospace" font-size="28" font-weight="700" fill="#10b981" text-anchor="middle">0</text>
  <text x="400" y="555" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">TRACKERS</text>
  <text x="620" y="536" font-family="monospace" font-size="28" font-weight="700" fill="#a855f7" text-anchor="middle">60+</text>
  <text x="620" y="555" font-family="system-ui,sans-serif" font-size="11" fill="#64748b" text-anchor="middle">TESTS PASS</text>
  <!-- URL -->
  <text x="1120" y="580" font-family="system-ui,sans-serif" font-size="16" fill="#475569" text-anchor="end">polllabs.dev</text>
</svg>
