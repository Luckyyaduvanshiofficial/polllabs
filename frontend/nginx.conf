server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml font/woff2;

    # Runtime origins, regenerated on every container start. This must come
    # before the immutable asset rule below, which would otherwise pin a stale
    # copy for a year and defeat the point of generating it at start-up.
    location = /runtime-config.js {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # Cache static assets aggressively. Astro fingerprints these filenames, so a
    # new build produces new names and the long max-age is safe.
    location ~* \.(js|css|woff2|woff|ttf|svg|png|jpg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is not fingerprinted: caching it would keep serving a page that
    # references asset names the new build no longer has.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        expires -1;
    }

    # Astro static pages — try exact file, then .html, then SPA fallback
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
