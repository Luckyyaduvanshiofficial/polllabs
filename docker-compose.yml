# ─── Polls Lab — Full Stack Docker Compose ────────────────────────────────────
# For local development: docker compose up --build
# For Dokploy: each service is deployed individually via Dokploy UI

version: "3.9"

services:
  # ── PocketBase Database ────────────────────────────────────────────────────
  db:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: polls-lab-db
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: polls-lab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POCKETBASE_URL=http://db:8090
      - POCKETBASE_ADMIN_EMAIL=${POCKETBASE_ADMIN_EMAIL}
      - POCKETBASE_ADMIN_PASSWORD=${POCKETBASE_ADMIN_PASSWORD}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SECRET_SALT=${SECRET_SALT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://pollslab.your-domain.com}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy

  # ── Astro Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - PUBLIC_API_URL=${PUBLIC_API_URL:-https://api.your-domain.com}
        - PUBLIC_SITE_URL=${PUBLIC_SITE_URL:-https://your-domain.com}
        - PUBLIC_PB_URL=${PUBLIC_PB_URL:-https://db.your-domain.com}
    container_name: polls-lab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pb_data:
    driver: local
